name: Node checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '26.x']
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
