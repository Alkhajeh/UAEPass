name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: Plugin
            directory: packages/flutter
          - package: Example
            directory: packages/flutter/example
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - if: matrix.package == 'Plugin'
        run: >-
          flutter test --no-pub --platform chrome
          test/web_authorization_test.dart test/signing_client_test.dart
      - if: matrix.package == 'Example'
        run: flutter test --no-pub --platform chrome test/web_signing_test.dart
      - if: matrix.package == 'Example'
        run: >-
          flutter build web --no-pub
          --dart-define=UAEPASS_WEB_REDIRECT_URI=http://localhost:8000
