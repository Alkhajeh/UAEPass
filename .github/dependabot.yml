version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /packages/node
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development

  - package-ecosystem: pub
    directories:
      - /packages/flutter
      - /packages/flutter/example
    schedule:
      interval: weekly
