name: uaepass
description: Flutter plugin for integrating UAE PASS sign-in on Android and iOS, with app-to-app handoff and a configurable backend exchange.
version: 0.0.5
repository: https://github.com/Alkhajeh/Flutter-UAEPass
issue_tracker: https://github.com/Alkhajeh/Flutter-UAEPass/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  plugin:
    platforms:
      android:
        package: com.example.uaepass
        pluginClass: UaepassPlugin
      ios:
        pluginClass: UaepassPlugin

  assets:
    - assets/buttons/authorize/ar/
    - assets/buttons/authorize/en/
    - assets/buttons/icon/
    - assets/buttons/login/ar/
    - assets/buttons/login/en/
    - assets/buttons/register_account/ar/
    - assets/buttons/register_account/en/
    - assets/buttons/sign_in/ar/
    - assets/buttons/sign_in/en/
    - assets/buttons/sign_up/ar/
    - assets/buttons/sign_up/en/
