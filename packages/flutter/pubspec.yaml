name: uaepass
description: UAE PASS sign-in and document signing approval on Android, iOS, and web, with official branded buttons.
version: 0.2.0
repository: https://github.com/Alkhajeh/UAEPass
issue_tracker: https://github.com/Alkhajeh/UAEPass/issues
screenshots:
  - description: The UAE PASS sign-in button in English and Arabic in the example app.
    path: doc/screenshots/sign-in-en-ar.png

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.6.0
  material_ui: ^1.11.1
  pdfrx: ^3.1.0
  web: ^1.1.1
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  plugin:
    platforms:
      android:
        package: com.example.uaepass
        pluginClass: UaepassPlugin
      ios:
        pluginClass: UaepassPlugin
      web:
        pluginClass: UaePassWebPlugin
        fileName: src/platform/web_plugin.dart

  assets:
    - assets/buttons/authorize/ar/
    - assets/buttons/authorize/en/
    - assets/buttons/icon/
    - assets/buttons/login/ar/
    - assets/buttons/login/en/
    - assets/buttons/register_account/ar/
    - assets/buttons/register_account/en/
    - assets/buttons/sign/ar/
    - assets/buttons/sign/en/
    - assets/buttons/sign_in/ar/
    - assets/buttons/sign_in/en/
    - assets/buttons/sign_up/ar/
    - assets/buttons/sign_up/en/
