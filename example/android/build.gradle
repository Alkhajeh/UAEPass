allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def appBuildDir = rootProject.layout.projectDirectory.dir('../build')
rootProject.layout.buildDirectory.set(appBuildDir)

subprojects {
    layout.buildDirectory.set(appBuildDir.dir(name))
    evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
