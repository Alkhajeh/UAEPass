name: uaepass
description: Flutter plugin for integrating UAE PASS sign-in on Android and iOS, with app-to-app handoff and a configurable backend exchange.
version: 0.0.5
repository: https://github.com/Alkhajeh/Flutter-UAEPass
issue_tracker: https://github.com/Alkhajeh/Flutter-UAEPass/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  material_ui: ^1.11.1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.uaepass
        pluginClass: UaepassPlugin
      ios:
        pluginClass: UaepassPlugin

  assets:
    - images/sign_in/
