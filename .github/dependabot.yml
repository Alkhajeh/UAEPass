version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /packages/node
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
    ignore:
      # Keep Node types on the oldest supported Node.js major (package.json engines).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pub
    directories:
      - /packages/flutter
      - /packages/flutter/example
    schedule:
      interval: weekly
